                for (let i = array.length - 1; i > 0; i--) {

                    [array[i], array[j]] = [array[j], array[i]];

                    { q: "You should stop __________ plastic cups and switch to reusable bamboo bottles.", correctText: "buying", wrongText: ["to buy", "buy", "bought"], explain: "'Stop + V-ing' nghĩa là dừng hẳn thói quen/hành động (dừng mua ly nhựa)." },

                    { q: "Single-use plastic bottles __________ to protect the marine ecosystem.", correctText: "should be banned", wrongText: ["banned", "should ban", "are banning"], explain: "Chủ ngữ chỉ vật 'plastic bottles' cần dạng bị động Modal Verb (should be banned)." },
                    { q: "Look at those dark grey clouds! It __________ rain in a few minutes.", correctText: "is going to", wrongText: ["will", "rains", "is raining"], explain: "Dự đoán dựa trên bằng chứng hiện tại (mây đen) dùng 'is going to'." },
                    { q: "The teacher made the students __________ the song scale three times.", correctText: "practice", wrongText: ["to practice", "practicing", "practiced"], explain: "Cấu trúc 'make + O + V-bare' (bắt ai làm gì) -> dùng practice." },
                    { q: "Nam promised __________ his debut single next month.", correctText: "to release", wrongText: ["release", "releasing", "released"], explain: "Sau 'promise' dùng động từ nguyên mẫu có 'to' (to release)." },
                    { q: "My father usually __________ the groceries for our family on Saturdays.", correctText: "buys", wrongText: ["is buying", "buy", "bought"], explain: "Dấu hiệu 'usually' diễn tả thói quen dùng Hiện tại đơn (buys)." },
                    { q: "Plastic bottles __________ into landfills every day.", correctText: "are thrown", wrongText: ["throw", "are throwing", "will throw"], explain: "Câu bị động ở thì hiện tại đơn: are + V3 (are thrown)." },
                    { q: "The audience cheered loudly, __________ the lead singer gave an outstanding performance.", correctText: "for", wrongText: ["but", "or", "nor"], explain: "Liên từ FANBOYS 'for' có nghĩa là 'vì/bởi vì'." }
                ];

                const selected = this.shuffleArray(rawPool).slice(0, count);

                return selected.map(item => {
                    // Combine correct and wrong answers into 1 array
                    const allOptions = [item.correctText, ...item.wrongText];
                    // Shuffle the 4 options using Fisher-Yates
                    const shuffledOptions = this.shuffleArray(allOptions);
                    // Find new index of correct answer
                    const correctIndex = shuffledOptions.indexOf(item.correctText);

                    return {
                        q: item.q,
                        options: shuffledOptions,
                        correct: correctIndex,
                        explain: item.explain
                    };
                });
            },

            generateRewrite: function(count = 4) {
                const pool = [
                    { prompt: "Nam likes collecting old glass bottles to protect nature.", instruction: "Viết lại câu dùng cấu trúc 'Nam is interested in...'", answer: "Nam is interested in collecting old glass bottles to protect nature." },
                    { prompt: "Why don't we plant more trees around the school campus?", instruction: "Viết lại câu dùng 'How about...'", answer: "How about planting more trees around the school campus?" },
                    { prompt: "People drop a huge amount of plastic waste into rivers every year.", instruction: "Chuyển câu sang bị động bắt đầu bằng: 'A huge amount of plastic waste...'", answer: "A huge amount of plastic waste is dropped into rivers every year." },
                    { prompt: "Lan plans to adopt a greener lifestyle next week.", instruction: "Viết lại câu dùng cấu trúc 'is going to'", answer: "Lan is going to adopt a greener lifestyle next week." },
                    { prompt: "His parents don't allow him to stay up late to watch concerts.", instruction: "Viết lại câu dùng cấu trúc 'don't let him...'", answer: "His parents don't let him stay up late to watch concerts." },
                    { prompt: "My father does the heavy lifting every weekend.", instruction: "Viết lại câu bị động bắt đầu bằng: 'The heavy lifting...'", answer: "The heavy lifting is done by my father every weekend." },
                    { prompt: "She practiced hard. She won first prize in the talent show.", instruction: "Nối 2 câu sử dụng liên từ 'so'", answer: "She practiced hard, so she won first prize in the talent show." }
                ];
                return this.shuffleArray(pool).slice(0, count);
            },

            generateRearrange: function(count = 4) {
                const pool = [
                    { full: "Recycling plastic waste reduces landfill pollution.", words: ["Recycling", "plastic", "waste", "reduces", "landfill", "pollution"] },
                    { full: "She avoids buying single-use plastic bags.", words: ["She", "avoids", "buying", "single-use", "plastic", "bags"] },
                    { full: "We should reduce our carbon footprint.", words: ["We", "should", "reduce", "our", "carbon", "footprint"] },
                    { full: "My father is the main breadwinner.", words: ["My", "father", "is", "the", "main", "breadwinner"] },
                    { full: "She is going to adopt a green lifestyle.", words: ["She", "is", "going", "to", "adopt", "a", "green", "lifestyle"] },
                    { full: "The audience cheered for the live performance.", words: ["The", "audience", "cheered", "for", "the", "live", "performance"] },
                    { full: "Banning single-use plastic protects the environment.", words: ["Banning", "single-use", "plastic", "protects", "the", "environment"] },
                    { full: "He decided to learn to play the piano.", words: ["He", "decided", "to", "learn", "to", "play", "the", "piano"] }
                ];

                const selected = this.shuffleArray(pool).slice(0, count);
                return selected.map(item => {
                    let shuffled = this.shuffleArray(item.words);
                    // Ensure the word array order is genuinely changed
                    if (shuffled.join(' ') === item.words.join(' ') && item.words.length > 2) {
                        shuffled = this.shuffleArray(item.words);
                    }
                    return {
                        shuffled: shuffled,
                        answer: item.full
                    };
                });
            },

            generateVerbForms: function(count = 4) {
                const pool = [
                    { sentence: "My sister suggested (recycle) _______ plastic containers at home.", answer: "recycling" },
                    { sentence: "They are keen on (participate) _______ in green campaigns.", answer: "participating" },
                    { sentence: "He hates (criticize) _______ by other judges on stage.", answer: "being criticized" },
                    { sentence: "Look! Nam (clean) _______ the house for TET holiday.", answer: "is cleaning" },
                    { sentence: "Plastic bottles (should / recycle) _______ to protect oceans.", answer: "should be recycled" },
                    { sentence: "Lan agreed (join) _______ the eco-friendly campaign.", answer: "to join" },
                    { sentence: "Her mother let her (go) _______ to the music festival.", answer: "go" },
                    { sentence: "I think people (use) _______ more solar energy in 2030.", answer: "will use" },
                    { sentence: "My brother usually (do) _______ the washing-up after dinner.", answer: "does" }
                ];
                return this.shuffleArray(pool).slice(0, count);
            }
        };

        // WEB SPEECH API INTEGRATION
        let synthVoices = [];
        function loadSynthVoices() {
            if ('speechSynthesis' in window) {
                synthVoices = window.speechSynthesis.getVoices();
            }
        }
        if ('speechSynthesis' in window) {
            loadSynthVoices();
            if (window.speechSynthesis.onvoiceschanged !== undefined) {
                window.speechSynthesis.onvoiceschanged = loadSynthVoices;
            }
        }

        function speakWord(text, btnElement) {
            if (!('speechSynthesis' in window)) {
                alert("Trình duyệt không hỗ trợ phát âm tự động.");
                return;
            }
            window.speechSynthesis.cancel();
            const utterance = new SpeechSynthesisUtterance(text);
            utterance.rate = 0.85;
            utterance.lang = 'en-US';

            if (synthVoices.length === 0) synthVoices = window.speechSynthesis.getVoices();
            const enVoice = synthVoices.find(v => v.lang.startsWith('en-US') || v.lang.startsWith('en-GB') || v.lang.includes('en'));
            if (enVoice) utterance.voice = enVoice;

            let originalHTML = btnElement ? btnElement.innerHTML : '';
            if (btnElement) {
                btnElement.innerHTML = `<i class="fa-solid fa-spinner fa-spin text-xs"></i>`;
                btnElement.classList.add('bg-brand-600', 'text-white');
            }

            utterance.onstart = function() {
                if (btnElement) btnElement.innerHTML = `<i class="fa-solid fa-waveform text-xs animate-pulse"></i>`;
            };
            utterance.onend = utterance.onerror = function() {
                if (btnElement) {
                    btnElement.innerHTML = originalHTML;
                    btnElement.classList.remove('bg-brand-600', 'text-white');
                }
            };
            window.speechSynthesis.speak(utterance);
        }

        function cleanString(str) {
            return str.trim().toLowerCase().replace(/\s+/g, ' ').replace(/[.,!?]$/, '');
        }

        function checkAllAnswers() {
            const ex = activeGeneratedExercises;
            if (!ex) return;

            let total = ex.mcq.length + ex.rewrite.length + ex.rearrange.length + ex.verb.length;
            let score = 0;

            // MCQ
            ex.mcq.forEach((item, idx) => {
                const selected = document.querySelector(`input[name="mcq-${idx}"]:checked`);
                const fb = document.getElementById(`mcq-fb-${idx}`);
                fb.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800');
                
                if (selected && parseInt(selected.value) === item.correct) {
                    score++;
                    fb.classList.add('bg-emerald-100', 'text-emerald-800');
                    fb.innerHTML = `✓ Chính xác! ${item.explain}`;
                } else {
                    fb.classList.add('bg-rose-100', 'text-rose-800');
                    fb.innerHTML = `✗ Chưa đúng! Đáp án đúng: <b>${String.fromCharCode(65 + item.correct)}. ${item.options[item.correct]}</b>. ${item.explain}`;
                }
            });

            // Rewrite
            ex.rewrite.forEach((item, idx) => {
                const val = document.getElementById(`rewrite-in-${idx}`).value;
                const fb = document.getElementById(`rewrite-fb-${idx}`);
                fb.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800');

                if (cleanString(val) === cleanString(item.answer)) {
                    score++;
                    fb.classList.add('bg-emerald-100', 'text-emerald-800');
                    fb.innerHTML = `✓ Chính xác!`;
                } else {
                    fb.classList.add('bg-rose-100', 'text-rose-800');
                    fb.innerHTML = `✗ Chưa đúng. Đáp án tham khảo: <i>"${item.answer}"</i>`;
                }
            });

            // Rearrange
            ex.rearrange.forEach((item, idx) => {
                const val = document.getElementById(`rearrange-in-${idx}`).value;
                const fb = document.getElementById(`rearrange-fb-${idx}`);
                fb.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800');

                if (cleanString(val) === cleanString(item.answer)) {
                    score++;
                    fb.classList.add('bg-emerald-100', 'text-emerald-800');
                    fb.innerHTML = `✓ Chính xác!`;
                } else {
                    fb.classList.add('bg-rose-100', 'text-rose-800');
                    fb.innerHTML = `✗ Chưa đúng. Câu đúng là: <i>"${item.answer}"</i>`;
                }
            });

            // Verb
            ex.verb.forEach((item, idx) => {
                const val = document.getElementById(`verb-in-${idx}`).value;
                const fb = document.getElementById(`verb-fb-${idx}`);
                fb.classList.remove('hidden', 'bg-emerald-100', 'text-emerald-800', 'bg-rose-100', 'text-rose-800');

                if (cleanString(val) === cleanString(item.answer)) {
                    score++;
                    fb.classList.add('bg-emerald-100', 'text-emerald-800');
                    fb.innerHTML = `✓ Chính xác!`;
                } else {
                    fb.classList.add('bg-rose-100', 'text-rose-800');
                    fb.innerHTML = `✗ Chưa đúng. Đáp án đúng: <b>${item.answer}</b>`;
                }
            });

            const scoreBox = document.getElementById('score-box');
            const scoreText = document.getElementById('score-text');
            const scoreBadge = document.getElementById('score-badge');

            const percent = Math.round((score / total) * 100);
            scoreBadge.innerText = `${score} / ${total} (${percent}%)`;
            scoreText.innerText = percent >= 80 ? "Xuất sắc! Bạn làm chủ kiến thức rất tốt." : "Hãy nhấn 'Sinh Bộ Bài Tập Mới' để tiếp tục rèn luyện!";
            scoreBox.classList.remove('hidden');
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function showSolutions() {
            const ex = activeGeneratedExercises;
            if (!ex) return;

            ex.mcq.forEach((item, idx) => {
                const fb = document.getElementById(`mcq-fb-${idx}`);
                fb.classList.remove('hidden', 'bg-rose-100', 'text-rose-800');
                fb.classList.add('bg-sky-100', 'text-sky-900');
                fb.innerHTML = `Đáp án: <b>${String.fromCharCode(65 + item.correct)}. ${item.options[item.correct]}</b> (${item.explain})`;
            });

            ex.rewrite.forEach((item, idx) => {
                const fb = document.getElementById(`rewrite-fb-${idx}`);
                fb.classList.remove('hidden', 'bg-rose-100', 'text-rose-800');
                fb.classList.add('bg-sky-100', 'text-sky-900');
                fb.innerHTML = `Đáp án: <b>${item.answer}</b>`;
            });

            ex.rearrange.forEach((item, idx) => {
                const fb = document.getElementById(`rearrange-fb-${idx}`);
                fb.classList.remove('hidden', 'bg-rose-100', 'text-rose-800');
                fb.classList.add('bg-sky-100', 'text-sky-900');
                fb.innerHTML = `Đáp án: <b>${item.answer}</b>`;
            });

            ex.verb.forEach((item, idx) => {
                const fb = document.getElementById(`verb-fb-${idx}`);
                fb.classList.remove('hidden', 'bg-rose-100', 'text-rose-800');
                fb.classList.add('bg-sky-100', 'text-sky-900');
                fb.innerHTML = `Đáp án: <b>${item.answer}</b>`;
            });
        }

        // Initialize App on Window Load
        window.onload = function() {
            switchMainTab('part1');
        };
    </script>
